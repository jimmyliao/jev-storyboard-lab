[project]
name = "jev-storyboard-lab"
version = "0.1.0"
description = "Same schema, two clouds: Google ADK and Microsoft Agent Framework generate a video storyboard, TypeSafe Jev QCs every scene."
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.19.0",
    "agent-framework-azure-ai>=1.0.0rc6",
    "google-adk>=2.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
